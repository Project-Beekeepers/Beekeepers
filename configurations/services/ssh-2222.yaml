#port being used for beekeeper
apiVersion: "v1"
protocol: "ssh"
address: ":2222"
description: "SSH with testing llm"
#The first regex that matches wins. Order: guards, fixed answers, silent commands, then the model.
commands:
  #--- guards: prompt-injection attempts never reach the model ---
  - regex: "(?i)(ignore.*(previous|all).*instructions|are you an? ai|chatgpt|language model|system prompt)"
    handler: "command not found"

  #--- fixed answers: instant, always identical, and must agree with the facts in the prompt below ---
  - regex: '^whoami\s*$'
    handler: "root"
  - regex: '^id\s*$'
    handler: "uid=0(root) gid=0(root) groups=0(root)"
  - regex: '^hostname\s*$'
    handler: "ubuntu"
  - regex: '^uname\s*$'
    handler: "Linux"
  - regex: '^uname -r\s*$'
    handler: "5.15.0-112-generic"
  - regex: '^uname -m\s*$'
    handler: "x86_64"
  - regex: '^uname -a\s*$'
    handler: "Linux ubuntu 5.15.0-112-generic #122-Ubuntu SMP Thu May 23 07:48:21 UTC 2024 x86_64 x86_64 x86_64 GNU/Linux"
  - regex: '^nproc\s*$'
    handler: "2"
  - regex: '^(python3 --version|python3 -V)\s*$'
    handler: "Python 3.10.12"
  - regex: '^crontab -l\s*$'
    handler: "no crontab for root"
  - regex: '^cat /etc/issue\s*$'
    handler: "Ubuntu 22.04.4 LTS \\n \\l\n"
  - regex: '^lsb_release -a\s*$'
    handler: |-
      No LSB modules are available.
      Distributor ID:	Ubuntu
      Description:	Ubuntu 22.04.4 LTS
      Release:	22.04
      Codename:	jammy
  - regex: '^cat /etc/os-release\s*$'
