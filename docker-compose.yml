services:
  beelzebub:
    build:
      context: .
      args:
        # Token for cloning private plugins during the image build (from .env).
        BEELZEBUB_GITHUB_TOKEN: ${BEELZEBUB_GITHUB_TOKEN:-}
    container_name: beelzebub
    restart: always
    ports:
      - "22:22"
      - "23:23"
      - "2222:2222"
      - "8080:8080"
      - "8081:8081"
      - "80:80"
      - "3306:3306"
      - "2112:2112" #Prometheus Open Metrics
    env_file:
      - path: .env
        required: false
    environment:
      RABBITMQ_URI: ${RABBITMQ_URI:-}
      OPEN_AI_SECRET_KEY: ${OPEN_AI_SECRET_KEY:-}
      # Beelzebub Cloud (from .env, written by install.sh)
      BEELZEBUB_CLOUD_ENABLED: ${BEELZEBUB_CLOUD_ENABLED:-false}
      BEELZEBUB_CLOUD_URI: ${BEELZEBUB_CLOUD_URI:-}
      BEELZEBUB_CLOUD_AUTH_TOKEN: ${BEELZEBUB_CLOUD_AUTH_TOKEN:-}
      # Write the log into the mounted ./logs folder so the alerter can read it
      BEELZEBUB_LOGGING_LOGS_PATH: /logs/beelzebub.log
    volumes:
      - "./configurations:/configurations"
      - "./state:/state"
      - "./logs:/logs" #beelzebub.log lands in ./logs so the alerter can read it

  #webhook alerter: starts with the honeypot and tails the same log file
  alerter:
    build: "./Beekeeper scripts/Slack bot"
    container_name: beekeeper-alerter
    restart: always
    depends_on:
      - beelzebub
    volumes:
      - "./logs:/logs:ro" #same log folder as beelzebub, read-only
      - "./Beekeeper scripts/Slack bot/.env:/app/.env:ro" #webhook type + URL
    environment:
      LOG_FILE: /logs/beelzebub.log #overrides the host path in .env
